services:
  - type: web
    name: craftflow-backend
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/craftflow-backend-1.0.0.jar
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://craftflow-siya.vercel.app
      - key: PORT
        value: 8080
