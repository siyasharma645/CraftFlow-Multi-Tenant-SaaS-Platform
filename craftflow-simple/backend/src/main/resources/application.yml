spring:
  application:
    name: craftflow-backend

  # H2 In-Memory Database - zero setup, works everywhere
  datasource:
    url: jdbc:h2:mem:craftflow;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api

craftflow:
  jwt:
    secret: ${JWT_SECRET:craftflow-super-secret-key-for-jwt-token-signing-minimum-256-bits-long-change-in-prod}
    expiration: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,https://craftflow-frontend.vercel.app}

logging:
  level:
    com.craftflow: INFO
    org.springframework.security: WARN
